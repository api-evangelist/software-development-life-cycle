specification: FinOps Framework
specificationVersion: '1.0'
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: Software Development Life Cycle
providerId: software-development-life-cycle
publisherName: Software Development Life Cycle
serviceCategory: API
created: '2026-05-04'
modified: '2026-05-04'
tags:
  - Development Process
  - Project Management
  - SDLC
  - Software Engineering
  - DevOps
  - CI/CD
  - FinOps
  - Cost Management
  - FOCUS
description: FinOps framework definition for the Software Development Life Cycle API surface. Provides
  a FOCUS-aligned mapping for cost allocation, usage measurement, and unit-economics reporting across
  the provider's APIs.
principles:
  - name: Visibility
    description: Make API consumption costs visible to engineering, product, and finance teams in near
      real-time.
  - name: Allocation
    description: Tag every chargeable API call with the consuming team, environment, application, and
      feature so cost can be allocated.
  - name: Optimization
    description: Continuously evaluate request patterns, caching, batching, and tier selection to reduce
      cost per useful unit of work.
  - name: Accountability
    description: Establish budget owners and chargeback or showback flows for each consuming team.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
      - Anomaly Management
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Benchmarking
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Architecting for Cloud
      - Rate Optimization
      - Workload Optimization
      - Cloud Sustainability
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - FinOps Practice Operations
      - FinOps Education and Enablement
      - Invoicing and Chargeback
      - Onboarding Workloads
      - Intersecting Disciplines
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Credit
    - Adjustment
  chargeFrequency: Recurring
focusColumns:
  ServiceName: Software Development Life Cycle
  ServiceCategory: Developer Tools / API
  ProviderName: Software Development Life Cycle
  PublisherName: Software Development Life Cycle
  InvoiceIssuerName: Software Development Life Cycle
  PricingCategory: Usage-Based
  PricingUnit: request
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: api_requests
    description: Count of billable API requests
    unit: request
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
      - region
      - consumer
  - name: data_egress
    description: Bytes returned over the network in API responses
    unit: GB
    aggregation: sum
    dimensions:
      - api
      - region
      - consumer
  - name: compute_seconds
    description: Server-side compute consumed by the request, where applicable
    unit: second
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
apis:
  - name: Requirements Management APIs
    baseURL: https://en.wikipedia.org/wiki/Requirements_management
    tags:
      - Requirements
      - User Stories
      - Backlog
      - Agile
    serviceName: Requirements Management APIs
    serviceCategory: API
  - name: Source Control APIs
    baseURL: https://api.github.com
    tags:
      - Source Control
      - Version Control
      - Git
      - Repositories
    serviceName: Source Control APIs
    serviceCategory: API
  - name: Continuous Integration and Delivery APIs
    baseURL: https://en.wikipedia.org/wiki/CI/CD
    tags:
      - CI/CD
      - Continuous Integration
      - Continuous Delivery
      - Pipelines
      - Automation
    serviceName: Continuous Integration and Delivery APIs
    serviceCategory: API
  - name: Testing and Quality Assurance APIs
    baseURL: https://en.wikipedia.org/wiki/Test_automation
    tags:
      - Testing
      - Quality Assurance
      - Test Automation
      - Security Testing
    serviceName: Testing and Quality Assurance APIs
    serviceCategory: API
  - name: Project Management APIs
    baseURL: https://en.wikipedia.org/wiki/Software_project_management
    tags:
      - Project Management
      - Agile
      - Scrum
      - Kanban
      - Sprint Planning
    serviceName: Project Management APIs
    serviceCategory: API
  - name: Release Management APIs
    baseURL: https://en.wikipedia.org/wiki/Software_release_life_cycle
    tags:
      - Release Management
      - Deployment
      - Change Management
      - Versioning
    serviceName: Release Management APIs
    serviceCategory: API
unitEconomics:
  - name: Cost per 1K Requests
    metric: billed_cost / (api_requests / 1000)
    target: TBD
  - name: Cost per Active Consumer
    metric: billed_cost / active_consumers
    target: TBD
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
